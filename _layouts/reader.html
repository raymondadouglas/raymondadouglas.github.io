<!DOCTYPE html>
<html lang="en" data-theme="light" data-book="{{ page.book }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <style>
    /* ── CSS custom properties (light theme defaults) ── */
    :root {
      --bg:        #fdf8f0;
      --fg:        #2c2416;
      --accent:    #9a8060;
      --accent-h:  #2c2416;
      --gold:      #c8a97a;
      --border:    #e0d4bc;
      --img-bg:    #fff;
      --cap-fg:    #9a8060;
    }

    [data-theme="dark"] {
      --bg:        #1a1510;
      --fg:        #e8dcc8;
      --accent:    #b09a76;
      --accent-h:  #e8dcc8;
      --gold:      #c8a97a;
      --border:    #3a3020;
      --img-bg:    #111;
      --cap-fg:    #a08868;
    }

    /* ── The Call of the Wild: a cold northern paper, with warm ember drop
       caps and ornaments (the fire against the cold that runs through it) ── */
    [data-book="cotw"] {
      --bg:        #eceef0;
      --fg:        #232830;
      --accent:    #586773;
      --accent-h:  #232830;
      --gold:      #b07a48;
      --border:    #d4d9dd;
      --img-bg:    #fbfcfd;
      --cap-fg:    #6b7783;
    }
    [data-book="cotw"][data-theme="dark"] {
      --bg:        #12161a;
      --fg:        #dce2e6;
      --accent:    #7e909d;
      --accent-h:  #dce2e6;
      --gold:      #c1824e;
      --border:    #262d33;
      --img-bg:    #0e1114;
      --cap-fg:    #8b98a4;
    }

    /* ── Call of the Wild typography experiment: Spectral body, Fraunces
       display (Fraunces's soft "old style" cut suits the wild subject) ── */
    [data-book="cotw"] body { font-family: 'Spectral', Georgia, serif; }
    [data-book="cotw"] .toc-header h1,
    [data-book="cotw"] .chapter-header h1,
    [data-book="cotw"] .chapter-num,
    [data-book="cotw"] .nav-title {
      font-family: 'Fraunces', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Lora', Georgia, serif;
      font-size: 1.15rem;
      line-height: 1.85;
      transition: background 0.25s, color 0.25s;
    }

    a { color: inherit; }

    .reader-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* ── top nav bar ── */
    .reader-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: 1rem;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 3rem;
    }
    .reader-nav > :first-child { text-align: left; justify-self: start; }
    .reader-nav > :last-child  { text-align: right; justify-self: end; }
    .reader-nav .reader-controls { align-self: center; }
    /* cotw: drop the rule under the nav — the header/plate below already
       provides the visual break. */
    [data-book="cotw"] .reader-nav {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 2rem;
    }

    .reader-nav a {
      color: var(--accent);
      text-decoration: none;
    }
    .reader-nav a:hover { color: var(--accent-h); }

    .nav-arrow { font-style: normal; }

    /* stacked nav label: small dir kicker over a title-case chapter name
       (Call of the Wild — keeps long titles from wrapping as wide caps) */
    .nav-dir {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
    }
    .nav-title {
      display: block;
      margin-top: 0.2rem;
      font-family: 'Lora', Georgia, serif;
      font-size: 0.92rem;
      letter-spacing: 0.01em;
      text-transform: none;
      color: var(--fg);
      line-height: 1.25;
    }
    .reader-nav a:hover .nav-title,
    .reader-footer a:hover .nav-title { color: var(--accent-h); }

    /* ── reader controls (night mode + text size) ── */
    .reader-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ctrl-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: inherit;
      font-size: 0.75rem;
      line-height: 1;
      padding: 0.25rem 0.45rem;
      border-radius: 3px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0;
      text-transform: none;
    }
    .ctrl-btn:hover {
      color: var(--accent-h);
      border-color: var(--accent);
    }

    /* ── chapter header ── */
    .chapter-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    /* cotw: the header sits on the page background; only the headpiece art
       rides a full-bleed white band (.chapter-plate) so it merges seamlessly.
       The title is pulled out onto the page and enlarged to lead the chapter. */
    [data-book="cotw"] .chapter-header {
      margin-top: 0.5rem;
      margin-bottom: 2.75rem;
    }
    [data-book="cotw"] .chapter-plate {
      width: 100vw;
      margin: 1.5rem 0 2rem;
      margin-left: calc(50% - 50vw);  /* must follow the shorthand, not precede it */
      box-sizing: border-box;
      background: #fff;
      padding: 2.5rem 1.5rem;
    }
    /* the book title leads the opener: a bit larger than a kicker so it reads
       as its own line, distinct from the chapter title below — but restrained. */
    [data-book="cotw"] .chapter-header .book-title-link {
      font-size: 1.05rem;
      letter-spacing: 0.16em;
      margin-bottom: 1rem;
    }

    .book-title-link {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 0.6rem;
    }
    .book-title-link:hover { color: var(--accent-h); }

    .chapter-header h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--fg);
    }

    .chapter-ornament {
      color: var(--gold);
      font-size: 1.4rem;
      margin-top: 0.6rem;
      display: block;
    }

    /* ── chapter number kicker + verse epigraph (Call of the Wild) ── */
    .chapter-num {
      display: block;
      font-family: 'Lora', Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0.24em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .chapter-epigraph {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.02rem;
      line-height: 1.6;
      color: var(--accent);
      text-align: center;
      margin: 1.4rem auto 0;
      max-width: 24rem;
    }

    /* ── decorative chapter headpiece vignette (sits above the title) ── */
    img.chapter-headpiece {
      display: block;
      max-width: min(420px, 100%);
      max-height: 100vh;
      width: auto;
      height: auto;
      margin: 0 auto 1.4rem;
    }
    /* chapter I: the headpiece also carries the title + verse, so give it room */
    img.chapter-headpiece.chapter-headpiece-full {
      max-width: min(540px, 100%);
      margin-bottom: 2rem;
    }
    /* cotw headpieces are full plates in their own right — let them go as wide as
       the band allows (P&P keeps the tighter cap above). */
    [data-book="cotw"] img.chapter-headpiece,
    [data-book="cotw"] img.chapter-headpiece.chapter-headpiece-full {
      max-width: 100%;
    }

    /* screen-reader-only heading (chapters whose title is set in the art) */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    /* ── body text ── */
    .chapter-body p {
      text-indent: 2em;
      margin-bottom: 0;
    }

    .chapter-body p + p {
      margin-top: 0;
    }

    /* first real text paragraph — no indent, drop cap */
    .chapter-body p.first-para {
      text-indent: 0;
    }

    .chapter-body p.first-para::first-letter {
      float: left;
      font-size: 4.5rem;
      line-height: 0.75;
      margin: 0.05em 0.07em 0 0;
      font-family: 'EB Garamond', Georgia, serif;
      color: var(--gold);
      font-weight: 400;
    }

    /* ── chapter opener illustration (from h2) ── */
    img.chapter-opener {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto 1.5rem;
      border: 1px solid var(--border);
      padding: 6px;
      background: var(--img-bg);
    }

    /* ── inline illustrations ── */
    .chapter-body img:not(.chapter-opener) {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 2rem auto;
      border: 1px solid var(--border);
      padding: 6px;
      background: var(--img-bg);
    }

    /* ── full-page plates & in-text cuts as full-bleed white bands ──
       The scan's paper is pure #fff, so a white band lets borderless
       figures dissolve into it seamlessly; framed plates sit centred.
       (cotw only — full-bleed breakout needs body overflow-x contained.) */
    [data-book="cotw"] body { overflow-x: hidden; }

    [data-book="cotw"] .chapter-body figure.plate,
    [data-book="cotw"] .chapter-body figure.cut {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      box-sizing: border-box;
      padding: 2.25rem 1.5rem;
      margin-top: 2.25rem;
      margin-bottom: 2.25rem;
      background: #fff;
      text-align: center;
    }
    /* strip the generic gray matte; image floats bare on the band.
       width:auto (not 100%) so that when the 100vh height cap binds, the image
       scales down proportionally (contain) instead of squashing. */
    [data-book="cotw"] .chapter-body figure.plate img,
    [data-book="cotw"] .chapter-body figure.cut img {
      display: block;
      margin: 0 auto;
      border: none;
      padding: 0;
      background: none;
      width: auto;
      height: auto;
      max-height: 100vh;
    }
    /* max-width:100% lets a crop go as wide as the band; with width:auto the
       intrinsic pixel size is the ceiling, so high-res plates render large while
       low-res ones stay natural (never upscaled/blurred). */
    [data-book="cotw"] .chapter-body figure.plate img { max-width: 100%; }
    [data-book="cotw"] .chapter-body figure.cut img   { max-width: 100%; }

    .chapter-body figure.plate figcaption {
      text-align: center;
      text-indent: 0;
      font-style: italic;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #6b7783;
      margin: 1.1rem auto 0;
      max-width: 30rem;
    }

    /* ── captions (legacy inline) ── */
    .chapter-body .caption,
    .chapter-body p.caption {
      text-align: center;
      text-indent: 0;
      font-style: italic;
      font-size: 0.88rem;
      color: var(--cap-fg);
      margin-top: -1rem;
      margin-bottom: 1.5rem;
    }

    /* ── bottom footer nav ── */
    .reader-footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: 1rem;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .reader-footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .reader-footer a:hover { color: var(--accent-h); }

    .footer-home { text-align: center; justify-self: center; }
    .reader-footer > *:first-child { text-align: left; justify-self: start; }
    .reader-footer > *:last-child  { text-align: right; justify-self: end; }

    /* ── table of contents page ── */
    .toc-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 2.5rem;
    }

    .site-back {
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    .site-back:hover { color: var(--accent-h); }

    .toc-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .toc-header h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 0.3rem;
    }

    .toc-header .author {
      font-style: italic;
      color: var(--accent);
      font-size: 1rem;
    }

    .toc-header .toc-ornament {
      color: var(--gold);
      font-size: 1.8rem;
      margin-top: 0.8rem;
      display: block;
    }

    .toc-cover-link {
      display: block;
      width: fit-content;
      margin: 1.5rem auto 0.75rem;
    }
    .toc-cover-link:hover .toc-cover {
      border-color: var(--gold);
      opacity: 0.9;
    }

    .toc-cover {
      display: block;
      max-width: 260px;
      height: auto;
      border: 1px solid var(--border);
      padding: 6px;
      background: var(--img-bg);
      transition: border-color 0.2s, opacity 0.2s;
    }

    /* ── frontispiece plate on the contents page ── */
    .toc-frontispiece {
      margin: 2.5rem auto 0;
      max-width: 340px;
      text-align: center;
    }
    .toc-frontispiece img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
      padding: 6px;
      background: var(--img-bg);
    }
    .toc-frontispiece figcaption {
      font-style: italic;
      font-size: 0.86rem;
      color: var(--cap-fg);
      line-height: 1.5;
      margin-top: 0.7rem;
    }
    /* cotw: frontispiece rides the same full-bleed white band as the plates */
    [data-book="cotw"] .toc-frontispiece {
      width: 100vw;
      max-width: none;
      margin: 2.75rem 0 0;
      margin-left: calc(50% - 50vw);
      box-sizing: border-box;
      padding: 2.25rem 1.5rem;
      background: #fff;
    }
    [data-book="cotw"] .toc-frontispiece img {
      margin: 0 auto;
      border: none;
      padding: 0;
      background: none;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100vh;
    }
    [data-book="cotw"] .toc-frontispiece figcaption {
      color: #6b7783;
      max-width: 30rem;
      margin: 1.1rem auto 0;
    }

    .begin-reading {
      display: block;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
    }
    .begin-reading:hover { color: var(--gold); }

    /* ── volume groupings ── */
    .toc-volumes {
      margin-top: 0.5rem;
    }

    .toc-volume {
      margin-top: 2rem;
    }

    .vol-heading {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .vol-heading::before,
    .vol-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .vol-heading span {
      font-family: 'Lora', Georgia, serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
    }

    /* chapter list — four columns, column-major flow */
    .toc-list {
      list-style: none;
      columns: 4;
      column-gap: 0.5rem;
      margin: 0;
      padding: 0;
    }

    .toc-list li {
      break-inside: avoid;
      padding: 0.22rem 0;
      text-align: center;
    }

    .toc-list a {
      color: var(--fg);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.15s;
    }
    .toc-list a:hover {
      color: var(--gold);
    }

    /* titled table of contents (Call of the Wild) — single centred column.
       compound selector keeps columns:1 winning over the mobile .toc-list rule */
    .toc-list.toc-list-titled {
      columns: 1;
      max-width: 22rem;
      margin: 0 auto;
    }
    .toc-list-titled li {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .toc-list-titled li:last-child { border-bottom: none; }
    .toc-list-titled a { font-size: 1rem; }

    .toc-note {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: var(--accent);
      text-align: center;
      font-style: italic;
      line-height: 1.6;
    }

    .toc-note a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .toc-note a:hover { color: var(--accent-h); }

    /* ── toc controls (night mode btn injected by JS) ── */
    .toc-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    @media (max-width: 600px) {
      body { font-size: 1.05rem; }
      .reader-shell { padding: 2rem 1.2rem 4rem; }
      .chapter-header h1 { font-size: 1.25rem; }
      .toc-list { columns: 2; }
    }

    @media (max-width: 380px) {
      .toc-list { columns: 1; }
    }
  </style>
</head>
<body>
  <div class="reader-shell">
    {{ content }}
  </div>

  <script>
    const LS_THEME = 'pandp-theme';
    function getTheme() { return localStorage.getItem(LS_THEME) || 'light'; }

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem(LS_THEME, t);
      document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.textContent = t === 'dark' ? '☀ Day' : '☾ Night';
      });
    }

    // apply before paint to avoid flash
    applyTheme(getTheme());

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.reader-controls, .toc-controls').forEach(function (container) {
        var btn = document.createElement('button');
        btn.className = 'ctrl-btn theme-btn';
        btn.setAttribute('aria-label', 'Toggle night mode');
        btn.textContent = getTheme() === 'dark' ? '☀ Day' : '☾ Night';
        btn.addEventListener('click', function () {
          applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
        });
        container.appendChild(btn);
      });
    });
  </script>
</body>
</html>
